name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  docs:
    name: Validate documentation
    runs-on: ubuntu-latest
    # Advisory by default so it never blocks a build. To make it blocking, add
    # "Validate documentation" to Settings -> Branches -> Branch protection rules.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the Obsidian knowledge base
        run: python3 scripts/validate_docs.py

      - name: Validate (strict)
        if: always()
        continue-on-error: true
        run: python3 scripts/validate_docs.py --strict

  build:
    name: Build and test Android app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # google-services.json is intentionally not committed.
      # This temporary CI configuration allows the Google Services
      # Gradle plugin to configure the debug build.
      - name: Create CI Firebase configuration
        shell: bash
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "neo-child-clinic-ci",
              "storage_bucket": "neo-child-clinic-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.neochildclinic"
                  }
                },
                "api_key": [
                  {
                    "current_key": "CI_BUILD_ONLY"
                  }
                ]
              }
            ]
          }
          EOF

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run Android lint
        run: ./gradlew lintDebug --no-daemon

      - name: Remove temporary Firebase configuration
        if: always()
        run: rm -f app/google-services.json
