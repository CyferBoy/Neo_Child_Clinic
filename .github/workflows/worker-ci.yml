name: Worker CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test and audit backup worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/backup-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # wrangler, miniflare and @cloudflare/kv-asset-handler all declare
          # engines.node >=22.0.0.
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/backup-worker/package-lock.json

      # The committed package-lock.json is malformed: 102 of its 292 entries carry no
      # `resolved` and no `integrity`, so `npm ci` dies inside npm's dependency-tree
      # builder with "Cannot read properties of null (reading 'edgesOut')". That breaks
      # every `npm ci` in this repo, not just CI. Work around it here so the M3 fix
      # actually gets tested; regenerate the lockfile locally and switch this back to
      # `npm ci`.
      - name: Install dependencies
        run: rm -f package-lock.json && npm install

      # The spec signs HS256 tokens with this secret and the Worker verifies them
      # from env.SUPABASE_JWT_SECRET, which vitest-pool-workers loads out of
      # .dev.vars. Throwaway value, scoped to this runner only.
      - name: Provide test secret
        run: echo "SUPABASE_JWT_SECRET=ci-test-secret-value" > .dev.vars

      # The cross-account confirm guard (audit M3) was recorded as "verified by CI"
      # while android-ci.yml was failing validation and never ran a job. This is
      # the job that actually proves it.
      - name: Run worker tests
        run: npm test

      # Closes security audit finding L7 (no dependency audit in CI).
      - name: Audit dependencies
        run: npm audit --audit-level=high