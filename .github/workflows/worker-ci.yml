name: Worker CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test and audit backup worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/backup-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, which fixes the Arborist "edgesOut" crash. Node 22 ships
          # npm 10.9.8 and dies on this dependency tree - see npm/cli#8261, closed
          # upstream with "bump CI Node version to 24 to avoid npm Arborist edgesOut
          # bug". 24 also satisfies the engines.node >=22.0.0 floor that wrangler,
          # miniflare and @cloudflare/kv-asset-handler declare.
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/backup-worker/package-lock.json

      # The committed lockfile was regenerated in the wrangler 3 -> 4 toolchain bump,
      # which also rewrote the entries that carried no `resolved`/`integrity` and made
      # `npm ci` die inside npm's dependency-tree builder. Plain `npm ci` works again.
      - name: Install dependencies
        run: npm ci

      # The spec signs HS256 tokens with this secret and the Worker verifies them
      # from env.SUPABASE_JWT_SECRET, which the Cloudflare vitest plugin loads out of
      # .dev.vars. Throwaway value, scoped to this runner only.
      - name: Provide test secret
        run: echo "SUPABASE_JWT_SECRET=ci-test-secret-value" > .dev.vars

      # tsc was never gated, so it sat at 5 errors. It is clean now - keep it that way.
      - name: Typecheck
        run: npx tsc --noEmit

      # The cross-account confirm guard (audit M3) was recorded as "verified by CI"
      # while android-ci.yml was failing validation and never ran a job. This is
      # the job that actually proves it.
      - name: Run worker tests
        run: npm test

      # Closes security audit finding L7 (no dependency audit in CI).
      #
      # Scoped to --omit=dev, and that is accurate rather than a dodge: src/index.ts imports
      # only ./jwt, so the Worker has zero runtime npm dependencies - node_modules here is
      # wrangler/miniflare/vitest, none of which is deployed.
      #
      # The unscoped audit is clean today. It went red for months on pins inside
      # @cloudflare/vitest-pool-workers (esbuild 0.17, undici 5.x/7.29.0, sharp 0.33/0.35.2);
      # those cleared with the wrangler 3 -> 4 bump and the pool's rename to
      # @cloudflare/vitest-plugin, which shares wrangler's miniflare instead of pinning an
      # older one.
      #
      # ponytail: miniflare advisories land upstream before any dependency of ours moves, so
      # a red unscoped audit is not automatically our bug. Re-check --omit=dev the day this
      # gains a real runtime dependency.
      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev