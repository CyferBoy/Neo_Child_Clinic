name: Android instrumented tests

# Room DAO SQL (soft-delete filtering, delimited JSON matching, migration indices) only
# executes against a real SQLite engine, so it lives in androidTest and does NOT run in
# `gradlew test`. Without this job those queries are unverified on every push.
#
# Advisory: it is a separate workflow so a device-level failure never blocks the main
# Android CI build. Make it blocking via Settings -> Branches -> Branch protection rules.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: android-instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: Instrumented tests on API 34
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # google-services.json is intentionally not committed; see android-ci.yml.
      - name: Create CI Firebase configuration
        shell: bash
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "neo-child-clinic-ci",
              "storage_bucket": "neo-child-clinic-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.neochildclinic"
                  }
                },
                "api_key": [
                  {
                    "current_key": "CI_BUILD_ONLY"
                  }
                ]
              }
            ]
          }
          EOF

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # `rc=$?` then `exit $rc`: the reporter runs even when Gradle fails (which is the only
      # time it has anything to say) and cannot swallow the failure. Emitting into this
      # step's own log rather than a separate one, because "There were failing tests" was
      # the last thing anyone reading this job could see.
      - name: Enable hardware acceleration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon; rc=$?; python3 .github/scripts/androidtest-failures.py; exit $rc
          disable-animations: true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          retention-days: 14

      - name: Remove temporary Firebase configuration
        if: always()
        run: rm -f app/google-services.json
