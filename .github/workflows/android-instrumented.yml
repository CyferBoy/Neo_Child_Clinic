name: Android instrumented tests

# Room DAO SQL (soft-delete filtering, delimited JSON matching, migration indices) only
# executes against a real SQLite engine, so it lives in androidTest and does NOT run in
# `gradlew test`. Without this job those queries are unverified on every push.
#
# Advisory: it is a separate workflow so a device-level failure never blocks the main
# Android CI build. Make it blocking via Settings -> Branches -> Branch protection rules.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: android-instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: Instrumented tests on API 34
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # google-services.json is intentionally not committed; see android-ci.yml.
      - name: Create CI Firebase configuration
        shell: bash
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "neo-child-clinic-ci",
              "storage_bucket": "neo-child-clinic-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.neochildclinic"
                  }
                },
                "api_key": [
                  {
                    "current_key": "CI_BUILD_ONLY"
                  }
                ]
              }
            ]
          }
          EOF

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Enable hardware acceleration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
          disable-animations: true

      # connectedDebugAndroidTest only prints "There were failing tests" and points at an
      # HTML report, so a failure costs a round trip to the artifact to diagnose. Parse the
      # JUnit XML that lands next to it and print the actual class, method and stack.
      - name: Report failing instrumented tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          # Do not pin one AGP output path - the connected-test XML has moved between AGP
          # versions. Sweep app/build for any JUnit file and say what was found either way,
          # so "found nothing" is distinguishable from "found nothing failing".
          paths = sorted(glob.glob("app/build/**/TEST-*.xml", recursive=True))
          print(f"JUnit XML files found: {len(paths)}")
          for path in paths:
              print(f"  {path}")
          if not paths:
              print("No instrumentation XML - Gradle failed before or during the test run.")
              sys.exit(0)
          failed = False
          for path in paths:
              for case in ET.parse(path).getroot().iter("testcase"):
                  for kind in ("failure", "error"):
                      for node in case.iter(kind):
                          failed = True
                          print(f"::group::{case.get('classname')}.{case.get('name')} [{kind}]")
                          print((node.get("message") or node.text or "").strip()[:4000])
                          print("::endgroup::")
          print("FAILED instrumented tests found." if failed else "XML parsed, zero failures in it.")
          PY

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          retention-days: 14

      - name: Remove temporary Firebase configuration
        if: always()
        run: rm -f app/google-services.json
