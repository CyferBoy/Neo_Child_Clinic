name: Android release

# Gated release build: only a vX.Y.Z tag push (validated below) or a manual dispatch with
# an explicit tag runs it. Debug CI stays in android-ci.yml and needs no secrets.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Assemble, lint, sign and verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bash .github/scripts/validate-release-tag.sh "$RELEASE_TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # google-services.json is intentionally not committed; see android-ci.yml.
      - name: Create CI Firebase configuration
        shell: bash
        run: bash .github/scripts/create-firebase-config.sh

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Fail closed before any build task: missing keystore secrets stop the job here.
      # All values come from repository secrets referenced via env - none are stored here.
      - name: Prepare release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash .github/scripts/prepare-release-keystore.sh

      - name: Lint release
        shell: bash
        run: ./gradlew lintRelease --no-daemon

      - name: Assemble signed release APK
        shell: bash
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signer
        shell: bash
        env:
          EXPECTED_SIGNER_SHA256: ${{ secrets.RELEASE_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n1)"
          if [ -z "$apk" ]; then
            echo "::error::No release APK found to verify."
            exit 1
          fi
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$apksigner" verify --print-certs "$apk" | tee signer.txt
          if [ -n "${EXPECTED_SIGNER_SHA256:-}" ]; then
            expected="$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d ':' | tr 'A-Z' 'a-z')"
            grep -qi "SHA-256 digest: $expected" signer.txt || {
              echo "::error::APK signer digest does not match the configured release signer."
              exit 1
            }
          fi

      - name: Archive mapping and signed APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ inputs.tag || github.ref_name }}
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Remove temporary Firebase configuration
        if: always()
        shell: bash
        run: rm -f app/google-services.json
