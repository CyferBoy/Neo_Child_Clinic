name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "32 20 * * 4"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # google-services.json is intentionally excluded from Git.
      # Create a temporary CI-only configuration so the Google Services
      # Gradle plugin can configure the debug build.
      - name: Create CI Firebase configuration
        shell: bash
        run: bash .github/scripts/create-firebase-config.sh

      - name: Build Android project
        shell: bash
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Remove temporary Firebase configuration
        if: always()
        shell: bash
        run: |
          rm -f app/google-services.json

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
